<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TekBot</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body class="chat-layout">
    <div class="main-container">

        <div class="sidebar">
            <button id="nova-sessao-btn" class="sidebar-button">
                <i class="fas fa-plus"></i> Nova Conversa
            </button>

            <div id="sessoes-lista" class="sessoes-container">
            </div>

            <div class="sidebar-footer">
                <label class="switch">
                    <input type="checkbox" id="botao-tema">
                    <span class="slider">
                        <i class="fas fa-sun icone sol"></i>
                        <i class="fas fa-moon icone lua"></i>
                    </span>
                </label>
                <button id="logout-btn" class="logout-button">
                    <i class="fas fa-sign-out-alt"></i> Sair
                </button>
            </div>
        </div>

        <div class="chat-container">
            <header class="chat-header">
                <button id="toggle-sidebar-btn" class="toggle-sidebar-btn">
                    <i class="fas fa-bars"></i>
                </button>
                <span class="chat-title">TekBot</span>
                <button id="criar-ticket-btn" class="criar-ticket-btn">
                    <i class="fas fa-ticket-alt"></i> Criar Ticket
                </button>
            </header>

            <main id="chat" class="chat-main">
            </main>

            <form id="chat-form" class="chat-form">
                <input id="user-input" type="text" placeholder="Digite sua mensagem..." class="chat-input" autocomplete="off"
                    required />
                <button type="submit" class="chat-button">Enviar</button>
            </form>
        </div>
    </div>

    <!-- Modal de Criar Ticket -->
    <div id="modal-ticket" class="modal-overlay" style="display: none;">
        <div class="modal-container modal-ticket-container">
            <div class="modal-header">
                <div class="modal-icon modal-icon-ticket">
                    <i class="fas fa-ticket-alt"></i>
                </div>
                <h3 class="modal-title">Criar Novo Ticket</h3>
                <button class="modal-close" id="fechar-modal-ticket">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <form id="form-ticket">
                    <div class="form-group">
                        <label for="ticket-titulo">Título do Ticket *</label>
                        <input type="text" id="ticket-titulo" class="form-input" 
                               placeholder="Ex: Problema com login no sistema" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="ticket-categoria">Categoria *</label>
                        <select id="ticket-categoria" class="form-input" required>
                            <option value="">Selecione uma categoria</option>
                            <option value="tecnico">Técnico</option>
                            <option value="financeiro">Financeiro</option>
                            <option value="duvida">Dúvida</option>
                            <option value="bug">Bug / Erro</option>
                            <option value="feature">Nova Funcionalidade</option>
                            <option value="outro">Outro</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="ticket-descricao">Descrição Detalhada *</label>
                        <textarea id="ticket-descricao" class="form-input form-textarea" rows="5" 
                                  placeholder="Descreva o problema ou solicitação de forma detalhada. Quanto mais informações, melhor!" 
                                  required></textarea>
                        <small class="form-hint">
                            <i class="fas fa-info-circle"></i> 
                            A prioridade será determinada automaticamente pela nossa IA com base na descrição
                        </small>
                    </div>
                    
                    <div class="form-group form-checkbox">
                        <input type="checkbox" id="ticket-incluir-historico" checked>
                        <label for="ticket-incluir-historico">
                            Incluir histórico desta conversa no ticket
                        </label>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="modal-btn modal-btn-cancel" id="cancelar-ticket">
                    Cancelar
                </button>
                <button class="modal-btn modal-btn-confirm" id="confirmar-ticket">
                    <i class="fas fa-paper-plane"></i> Criar Ticket
                </button>
            </div>
        </div>
    </div>
    
    <script src="../js/chat.js"></script>
    <script src="../js/tema.js"></script>
</body>

</html>
