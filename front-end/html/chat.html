<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TekBot</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body class="chat-layout">
    <div class="main-container">

        <div class="sidebar">
            <button id="nova-sessao-btn" class="sidebar-button">
                <i class="fas fa-plus"></i> Nova Conversa
            </button>

            <div id="sessoes-lista" class="sessoes-container">
            </div>

            <div class="sidebar-footer">
                <label class="switch">
                    <input type="checkbox" id="botao-tema">
                    <span class="slider">
                        <i class="fas fa-sun icone sol"></i>
                        <i class="fas fa-moon icone lua"></i>
                    </span>
                </label>
                <button id="logout-btn" class="logout-button">
                    <i class="fas fa-sign-out-alt"></i> Sair
                </button>
            </div>
        </div>

        <div class="chat-container">
            <header class="chat-header">
                <button id="toggle-sidebar-btn" class="toggle-sidebar-btn">
                    <i class="fas fa-bars"></i>
                </button>
                <span class="chat-title">TekBot</span>
            </header>

            <main id="chat" class="chat-main">
            </main>

            <form id="chat-form" class="chat-form">
                <input id="user-input" type="text" placeholder="Digite sua mensagem..." class="chat-input" autocomplete="off"
                    required />
                <button type="submit" class="chat-button">Enviar</button>
            </form>
        </div>
    </div>
    
    <script src="../js/chat.js"></script>
    <script src="../js/tema.js"></script>
</body>

</html>
